[package]
name = "notepadpp-rs"
version = "0.1.0"
edition = "2024"
authors = ["Laurent VOLFF"]
description = "Clean-room implementation of Notepad++ in Rust (GUI and CLI compatible)"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = "0.4.40"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
encoding_rs = "0.8.35"
regex = "1.12.3"
rfd = "0.15.2"
urlencoding = "2.1.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
